<!--
  === Consolidated (2026-09-16) ===
  This page previously had its own separate, unfixed login flow: a mock
  OTP path with no real Supabase session, and NO Google OAuth return-trip
  handler at all (calling handleGoogleLogin() sent the user to Google and
  back, but nothing here ever detected the #access_token= hash on return —
  the exact redirect-loop bug already found and fixed once in
  store-login.html). Rather than duplicate that fix in four separate
  files, every login entry point now forwards to the single, tested
  login.html, which owns real Supabase OTP/password/Google auth and the
  one shared handleUserRedirect() role router.
  This file is kept (rather than deleted) only so old bookmarks/links
  still work; it does no work of its own.
-->
<script>
  window.location.replace('login.html' + window.location.search + window.location.hash);
</script>
